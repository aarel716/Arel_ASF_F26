<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Logbook Login</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        img {
            width: 500px;
            max-width: 90%;
            margin-top: 30px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        p {
            margin: 10px 0;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
        }

        footer h2 {
            font-size: 18px;
            font-weight: normal;
        }

        a {
            color: #66b3ff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #99ccff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<img
        src="pilot-logbook-logo.png"
        alt="Pilot Logbook logo with a helicopter and airplane">

<h1>Login</h1>
<p>Welcome to Pilot Logbook. Sign in to record and manage your flight hours.</p>

<form>
    <label for="username">Username:</label>
    <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username">

    <br><br>

    <label for="password">Password:</label>
    <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password">

    <br><br>

    <button type="submit">Sign In</button>
</form>
<p>Don't have an account?</p>
<a href="#">Create Account</a>

<footer>
    <h2>&copy; July 30, 2026 - Adam Arel</h2>
</footer>

</body>
</html>
