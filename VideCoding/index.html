<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Logbook Login</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        img {
            width: 500px;
            max-width: 90%;
            margin-top: 30px;
            border-radius: 10px;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<img
        src="pilot-logbook-logo.png"
        alt="Pilot Logbook logo with a helicopter and airplane"
        width="400"
>
<h1>Login</h1>
<p>Welcome to Pilot Logbook. Sign in to record and manage your flight hours.</p>

<form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username">

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">

    <br><br>

    <button type="submit">Sign In</button>
</form>

</body>
<footer>
    <h2>&copy; July 30, 2026 - Adam Arel</h2>
</footer>
</html>
